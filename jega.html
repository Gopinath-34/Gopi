<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f2f2f2;
        }

        .container {
            width: 85%;
            margin: auto;
            padding: 20px 0;
        }

        /* Banner Image */
        .banner {
            width: 100%;
            height: 220px;
            background: #d9d9d9;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #000;
            margin-bottom: 20px;
        }

        /* Video Section */
        .video {
            width: 100%;
            height: 200px;
            background: #e1e1e1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #000;
            margin-bottom: 20px;
            font-size: 40px;
        }

        /* Call to Action Button */
        .cta {
            display: block;
            width: 200px;
            margin: 0 auto 30px auto;
            padding: 12px;
            background: #008cff;
            color: #fff;
            border: none;
            text-align: center;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Testimonials */
        .testimonial-section {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .testimonial {
            width: 48%;
            background: #fff;
            padding: 10px;
            border: 2px solid #000;
        }

        .test-img {
            width: 100%;
            height: 140px;
            background: #d9d9d9;
            border: 2px solid #000;
            margin-bottom: 10px;
        }

        .test-text {
            background: #fafafa;
            padding: 10px;
            border: 1px solid #000;
            height: 70px;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Banner image -->
        <div class="banner">
            Banner Image
        </div>

        <!-- Explainer video section -->
        <div class="video">
            ▶
        </div>

        <!-- Call to action -->
        <button class="cta">Call To Action</button>

        <!-- Testimonial Section -->
        <div class="testimonial-section">

            <div class="testimonial">
                <div class="test-img"></div>
                <div class="test-text">Testimonial text goes here.</div>
            </div>

            <div class="testimonial">
                <div class="test-img"></div>
                <div class="test-text">Testimonial text goes here.</div>
            </div>

        </div>
    </div>
</body>
</html>
